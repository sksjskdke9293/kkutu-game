<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>운영자 로그인 | 끄투게임즈코리아</title>
 <link rel="stylesheet" href="/css/admin-login.css?v=20260925-1">
 <script src="/js/admin-login.js?v=20260925-1" defer></script>
</head>
<body>
 <a class="back" href="/">← 메인으로</a>
 <main class="login-shell">
  <img src="/img/custom/site-logo-ko.png?v=20260920" alt="끄투게임즈코리아">
  <section class="login-card">
   <span class="eyebrow">ADMIN CONSOLE</span>
   <h1>운영자 로그인</h1>
   <p>운영자 계정으로 관리자 도구에 접속합니다.</p>
   <form id="AdminLoginForm">
    <label for="AdminUsername">아이디</label>
    <input id="AdminUsername" name="username" autocomplete="username" required>
    <label for="AdminPassword">비밀번호</label>
    <input id="AdminPassword" name="password" type="password" autocomplete="current-password" required>
    <output id="AdminLoginError" role="alert"></output>
    <button type="submit">로그인</button>
   </form>
  </section>
 </main>
</body>
</html>
